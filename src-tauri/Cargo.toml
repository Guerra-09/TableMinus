[package]
name = "tableminus"
version = "0.4.1"
description = "TableMinus — free, open-source, lightweight database client"
authors = ["Jose Guerra"]
license = "MIT"
repository = "https://github.com/Guerra-09/TableMinus"
edition = "2021"

[lib]
name = "tableminus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "process", "net", "io-util", "rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "mysql",
  "sqlite",
] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
